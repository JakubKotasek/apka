<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plank Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #4caf50; margin-top: 0; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #4caf50; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button.stop { background: #f44336; height: 80px; font-size: 20px; }
        .text-btn { background: transparent; margin-top: 10px; padding: 8px; font-size: 14px; color: #888; border: none; cursor: pointer;}
        
        .timer { font-size: 70px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .countdown { color: #ffeb3b; font-size: 30px; min-height: 40px; margin-top: 10px; }
        
        .stats { text-align: left; margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; background: #333; padding: 8px 5px; font-size: 12px; border-radius: 5px; margin: 0; white-space: nowrap; }
        .tab-btn.active { background: #4caf50; color: white; }
        
        .stat-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #444; display: flex; align-items: flex-start; justify-content: space-between; }
        .stat-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .rank-box { width: 35px; text-align: center; font-size: 1.4em; font-weight: bold; color: #888; margin-right: 10px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-top: 5px;}
        
        .player-info { flex-grow: 1; display: flex; flex-direction: column; text-align: left; }
        .player-name-row { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-today { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
        .status-yesterday { background: #ffeb3b; }
        .status-sleep { background: #f44336; }
        
        .stat-main-val { font-size: 1.2em; font-weight: bold; color: white; }
        .stat-sub-val { font-size: 0.85em; color: #aaa; margin-top: 2px; }
        .diff-text { font-size: 0.75em; color: #ff9800; margin-top: 4px; font-weight: bold; }
        
        .view-profile-btn { background: #333; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 5px; width: auto; margin: 0; margin-top: 5px; height: fit-content;}
        
        .profile-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .avatar-btn { background: #333; font-size: 40px; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0; padding: 0; border: 2px solid #4caf50; flex-shrink: 0; }
        .level-badge { background: #ffeb3b; color: #000; padding: 5px 10px; border-radius: 15px; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin: 15px 0; }
        .ach-box { background: #333; border-radius: 8px; padding: 8px 5px; text-align: center; font-size: 24px; opacity: 0.3; filter: grayscale(100%); transition: 0.3s; position: relative; }
        .ach-box.unlocked { opacity: 1; filter: grayscale(0%); background: #3a4a3a; box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); border: 1px solid #4caf50; cursor: pointer; }
        .ach-box.unlocked:active { transform: scale(0.95); }
        .ach-title { font-size: 9px; color: #fff; margin-top: 5px; line-height: 1.1; word-wrap: break-word; }
        .ach-category-title { font-size: 13px; color: #aaa; text-align: left; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .showcase-star { position: absolute; top: -5px; right: -5px; font-size: 14px; text-shadow: 0 0 5px black; }
        
        .days-container { display: flex; justify-content: space-between; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px;}
        .day-box { width: 35px; height: 35px; background: #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; user-select: none; }
        .day-box.rest { background: #2196f3; color: white; box-shadow: 0 0 8px rgba(33, 150, 243, 0.5); }
        
        .history-list { max-height: 150px; overflow-y: auto; background: #222; padding: 10px; border-radius: 8px; text-align: left; margin-bottom: 15px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #444; font-size: 14px; }
        .del-btn { background: transparent; color: #f44336; padding: 2px 5px; margin: 0; width: auto; font-size: 12px; border: none; cursor: pointer;}
    </style>
</head>
<body>
    <div class="container">
        <h1 id="app-title">Plank Tracker ⏱️</h1>

        <!-- 1. HLAVNÍ OBRAZOVKA -->
        <div id="setup-section">

            <hr style="border-color: #444; margin: 15px 0;">

                <input type="password" id="new-user-pin" placeholder="PIN (ochrana)" style="flex: 1;" maxlength="4">
            </div>
            <button onclick="addUser()">Přidat nového člověka</button>
            
            <div class="stats">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin:0; color: #ffeb3b;">🏆 Síň slávy</h3>
                    <div style="font-size: 10px; color: #888;">
                        <span class="status-dot status-today" style="width:8px;height:8px;"></span> Dnes 
                        <span class="status-dot status-yesterday" style="width:8px;height:8px;margin-left:5px;"></span> Včera
                    </div>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="changeLeaderboard('total', this)">Celkově</button>
                    <button class="tab-btn" onclick="changeLeaderboard('month', this)">Tento měsíc</button>
                    <button class="tab-btn" onclick="changeLeaderboard('max', this)">Max Výdrž</button>
                    <button class="tab-btn" onclick="changeLeaderboard('streak', this)">Série 🔥</button>
                </div>
                
                <div id="stats-list">Načítám data...</div>
            </div>
        </div>

        <!-- 2. TVŮJ PROFIL -->
        <div id="profile-section" style="display:none;">

            <div style="text-align: left; margin-bottom: 10px;">

            </div>

            <div class="profile-header">

                <div style="text-align: left;">

                    <span id="streak-display" style="color: #ff9800; font-weight: bold; font-size: 14px;"></span>
                </div>
            </div>
            <div id="level-display" class="level-badge"></div>
            <button onclick="goToWorkout()" style="font-size: 18px; padding: 15px; margin-bottom: 15px;">JÍT CVIČIT 💪</button>

            <!-- Dny odpočinku -->
            <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">💤 Dny odpočinku (Kliknutím zmodrá):</div>
            <div class="days-container" id="rest-days-container">
                <div class="day-box" data-day="0">Po</div>
                <div class="day-box" data-day="1">Út</div>
                <div class="day-box" data-day="2">St</div>
                <div class="day-box" data-day="3">Čt</div>
                <div class="day-box" data-day="4">Pá</div>
                <div class="day-box" data-day="5">So</div>
                <div class="day-box" data-day="6">Ne</div>
            </div>

            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 15px;">🏅 Tvoje Vitrína (Kliknutím vyber 3 k chlubení)</div>
            <div id="my-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto;"></div>
            
            <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">🕒 Historie:</div>
            <div class="history-list" id="history-list"></div>

            <button class="text-btn" onclick="deleteProfile()" style="color: #f44336; float: right; margin-top: 15px;">🗑️ Smazat profil</button>
            <div style="clear: both;"></div>
        </div>

        <!-- 3. OBRAZOVKA CVIČENÍ -->
        <div id="workout-section" style="display:none;">
            <h2 id="workout-user-name" style="color: #4caf50;"></h2>
            <div id="countdown-display" class="countdown"></div>
            <div class="timer" id="timer-display">00:00</div>
            <button id="start-btn" onclick="startCountdown()" style="height: 60px; font-size: 18px;">START (3s příprava)</button>
            <button id="stop-btn" class="stop" onclick="stopTimer()" style="display:none;">Konec planku</button>
            <button class="text-btn" id="cancel-btn" onclick="cancelWorkout()" style="margin-top: 20px;">Zrušit (Nezapočítávat)</button>
        </div>

        <!-- 4. VEŘEJNÝ PROFIL -->
        <div id="public-profile-section" style="display:none;">
            <!-- Tlačítko Zpět úplně nahoře -->
            <div style="text-align: left; margin-bottom: 10px;">
                <button class="text-btn" onclick="closePublicProfile()" style="margin: 0; padding: 5px 0; font-size: 16px;">🔙 Zpět na Síň slávy</button>
            </div>

            <div class="profile-header">
                <div class="avatar-btn" id="pub-avatar-display" style="border-color: #888; cursor: default;"></div>
                <div style="text-align: left;">
                    <h2 id="pub-profile-name" style="margin: 0; color: #fff;"></h2>
                    <span id="pub-streak-display" style="color: #ff9800; font-weight: bold; font-size: 14px;"></span>
                </div>
            </div>
            <div id="pub-level-display" class="level-badge" style="background:#555; color:#fff;"></div>
            <div class="stats" style="margin-top: 10px;">
                <div style="display: flex; justify-content: space-around; text-align: center;">
                    <div><div style="font-size:12px; color:#aaa;">Celkem</div><strong id="pub-total-time"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Maximum</div><strong id="pub-max-time" style="color:#ffeb3b;"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Tréninků</div><strong id="pub-workout-count"></strong></div>
                </div>
            </div>
            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 15px;">🏅 Vitrína hráče</div>
            <div id="pub-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto;"></div>
        </div>

    </div>
