<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plank Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #4caf50; margin-top: 0; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #4caf50; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button.stop { background: #f44336; height: 80px; font-size: 20px; }
        .text-btn { background: transparent; margin-top: 10px; padding: 8px; font-size: 14px; color: #888; }
        
        .timer { font-size: 70px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .countdown { color: #ffeb3b; font-size: 30px; min-height: 40px; margin-top: 10px; }
        
        .stats { text-align: left; margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .stat-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #444; display: flex; align-items: center; justify-content: space-between; }
        .stat-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        /* Zarovnání ranku a korunky */
        .rank-box { width: 35px; text-align: center; font-size: 1.4em; font-weight: bold; color: #888; margin-right: 15px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
        .rank-box.crown { color: gold; font-size: 1.6em; }
        
        .profile-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .avatar-btn { background: #333; font-size: 40px; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0; padding: 0; border: 2px solid #4caf50; flex-shrink: 0; }
        .level-badge { background: #ffeb3b; color: #000; padding: 5px 10px; border-radius: 15px; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        
        /* Nové zobrazení Achievementů */
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin: 15px 0; }
        .ach-box { background: #333; border-radius: 8px; padding: 8px 5px; text-align: center; font-size: 24px; opacity: 0.3; filter: grayscale(100%); transition: 0.3s; position: relative; }
        .ach-box.unlocked { opacity: 1; filter: grayscale(0%); background: #3a4a3a; box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); border: 1px solid #4caf50; }
        .ach-title { font-size: 9px; color: #fff; margin-top: 5px; line-height: 1.1; word-wrap: break-word; }
        .ach-category-title { font-size: 13px; color: #aaa; text-align: left; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        
        .days-container { display: flex; justify-content: space-between; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px;}
        .day-box { width: 35px; height: 35px; background: #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; user-select: none; }
        .day-box.rest { background: #2196f3; color: white; box-shadow: 0 0 8px rgba(33, 150, 243, 0.5); }
        
        .history-list { max-height: 150px; overflow-y: auto; background: #222; padding: 10px; border-radius: 8px; text-align: left; margin-bottom: 15px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #444; font-size: 14px; }
        .del-btn { background: transparent; color: #f44336; padding: 2px 5px; margin: 0; width: auto; font-size: 12px; }
        .view-profile-btn { background: #333; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 5px; width: auto; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="app-title">Plank Tracker ⏱️</h1>

        <!-- 1. HLAVNÍ OBRAZOVKA -->
        <div id="setup-section">
            <select id="user-select">
                <option value="">-- Kdo jde cvičit? --</option>
            </select>
            <hr style="border-color: #444; margin: 15px 0;">
            <input type="text" id="new-user-name" placeholder="Nové jméno (např. Barbora)">
            <button onclick="addUser()">Přidat nového člověka</button>
            
            <div class="stats">
                <h3 style="margin-top:0; color: #ffeb3b;">🏆 Síň slávy</h3>
                <div id="stats-list">Načítám data...</div>
            </div>
        </div>

        <!-- 2. TVŮJ PROFIL -->
        <div id="profile-section" style="display:none;">
            <div class="profile-header">
                <button class="avatar-btn" id="avatar-display" onclick="changeAvatar()"></button>
                <div style="text-align: left;">
                    <h2 id="profile-name" style="margin: 0; color: #4caf50;"></h2>
                    <span id="streak-display" style="color: #ff9800; font-weight: bold; font-size: 14px;"></span>
                </div>
            </div>
            
            <div id="level-display" class="level-badge"></div>

            <button onclick="goToWorkout()" style="font-size: 18px; padding: 15px; margin-bottom: 15px;">JÍT CVIČIT 💪</button>

            <!-- Vitrína trofejí -->
            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 10px;">🏅 Tvoje Vitrína</div>
            <div id="my-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto;"></div>

            <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">Dny odpočinku (Kliknutím zmodrá):</div>
            <div class="days-container" id="rest-days-container">
                <div class="day-box" data-day="0">Po</div>
                <div class="day-box" data-day="1">Út</div>
                <div class="day-box" data-day="2">St</div>
                <div class="day-box" data-day="3">Čt</div>
                <div class="day-box" data-day="4">Pá</div>
                <div class="day-box" data-day="5">So</div>
                <div class="day-box" data-day="6">Ne</div>
            </div>
            
            <div style="font-size: 12px; color: #888; text-align: left;">Historie:</div>
            <div class="history-list" id="history-list"></div>

            <button class="text-btn" onclick="logout()">🔙 Zpět na výběr osoby</button>
            <button class="text-btn" onclick="deleteProfile()" style="color: #f44336; float: right;">🗑️ Smazat profil</button>
        </div>

        <!-- 3. OBRAZOVKA CVIČENÍ -->
        <div id="workout-section" style="display:none;">
            <h2 id="workout-user-name" style="color: #4caf50;"></h2>
            <div id="countdown-display" class="countdown"></div>
            <div class="timer" id="timer-display">00:00</div>
            
            <button id="start-btn" onclick="startCountdown()" style="height: 60px; font-size: 18px;">START (3s příprava)</button>
            <button id="stop-btn" class="stop" onclick="stopTimer()" style="display:none;">Konec planku</button>
            
            <button class="text-btn" id="cancel-btn" onclick="cancelWorkout()" style="margin-top: 20px;">Zrušit (Nezapočítávat)</button>
        </div>

        <!-- 4. VEŘEJNÝ PROFIL JINÉHO HRÁČE -->
        <div id="public-profile-section" style="display:none;">
            <div class="profile-header">
                <div class="avatar-btn" id="pub-avatar-display" style="border-color: #888; cursor: default;"></div>
                <div style="text-align: left;">
                    <h2 id="pub-profile-name" style="margin: 0; color: #fff;"></h2>
                    <span id="pub-streak-display" style="color: #ff9800; font-weight: bold; font-size: 14px;"></span>
                </div>
            </div>
            <div id="pub-level-display" class="level-badge" style="background:#555; color:#fff;"></div>
            
            <div class="stats" style="margin-top: 10px;">
                <div style="display: flex; justify-content: space-around; text-align: center;">
                    <div><div style="font-size:12px; color:#aaa;">Celkem</div><strong id="pub-total-time"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Maximum</div><strong id="pub-max-time" style="color:#ffeb3b;"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Tréninků</div><strong id="pub-workout-count"></strong></div>
                </div>
            </div>

            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 15px;">🏅 Vitrína hráče</div>
            <div id="pub-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto;"></div>

            <button onclick="closePublicProfile()" style="margin-top: 20px;">Zavřít profil</button>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCsagLks4YBVwm9dc2l6PmfvMex5N7U_90",
          authDomain: "plank-fbddb.firebaseapp.com",
          databaseURL: "https://plank-fbddb-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "plank-fbddb",
          storageBucket: "plank-fbddb.firebasestorage.app",
          messagingSenderId: "825438354813",
          appId: "1:825438354813:web:4ee1c56c2b88163996e014",
          measurementId: "G-V8KPY0Y0ZP"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let allUsersData = {};
        let timerInterval, countdownInterval;
        let secondsElapsed = 0;
        let isPlanking = false;
        const avatars = ['👤', '🦁', '🥷', '🧘‍♀️', '🦾', '🔥', '👑', '👽', '😎', '🦄', '🦖', '🍕'];

        // DEFINICE ACHIEVEMENTŮ
        const ACHIEVEMENTS = [
            // Max čas v planku
            { id: 'max_1m', cat: 'Nejdelší výdrž', title: '1 min: První milník', icon: '⏱️', req: (d) => (d.longestPlank || 0) >= 60 },
            { id: 'max_2m', cat: 'Nejdelší výdrž', title: '2 min: Slušný základ', icon: '👍', req: (d) => (d.longestPlank || 0) >= 120 },
            { id: 'max_3m', cat: 'Nejdelší výdrž', title: '3 min: Břicho z kamene', icon: '🪨', req: (d) => (d.longestPlank || 0) >= 180 },
            { id: 'max_5m', cat: 'Nejdelší výdrž', title: '5 min: Ocelová deska', icon: '🛡️', req: (d) => (d.longestPlank || 0) >= 300 },
            { id: 'max_7m', cat: 'Nejdelší výdrž', title: '7.5 min: Učeň', icon: '🦾', req: (d) => (d.longestPlank || 0) >= 450 },
            { id: 'max_10m', cat: 'Nejdelší výdrž', title: '10 min: Gravitační anomálie', icon: '🌌', req: (d) => (d.longestPlank || 0) >= 600 },
            { id: 'max_13m', cat: 'Nejdelší výdrž', title: '13 min: Mistr Zenu', icon: '🧘', req: (d) => (d.longestPlank || 0) >= 780 },
            { id: 'max_15m', cat: 'Nejdelší výdrž', title: '15 min: Strojový kód', icon: '🤖', req: (d) => (d.longestPlank || 0) >= 900 },
            { id: 'max_20m', cat: 'Nejdelší výdrž', title: '20 min: Nadčlověk', icon: '🦸‍♂️', req: (d) => (d.longestPlank || 0) >= 1200 },
            { id: 'max_30m', cat: 'Nejdelší výdrž', title: '30 min: Bůh Planků', icon: '⚡', req: (d) => (d.longestPlank || 0) >= 1800 },
            // Celkový čas
            { id: 'tot_1h', cat: 'Celkový čas', title: '1h: Pokročilá brambora', icon: '🥔', req: (d) => (d.totalTime || 0) >= 3600 },
            { id: 'tot_2h', cat: 'Celkový čas', title: '2h: Pevný základ', icon: '🏗️', req: (d) => (d.totalTime || 0) >= 7200 },
            { id: 'tot_5h', cat: 'Celkový čas', title: '5h: Ocelový střed', icon: '⚙️', req: (d) => (d.totalTime || 0) >= 18000 },
            { id: 'tot_10h', cat: 'Celkový čas', title: '10h: Kyborg', icon: '🦾', req: (d) => (d.totalTime || 0) >= 36000 },
            { id: 'tot_24h', cat: 'Celkový čas', title: '24h: Fanatik', icon: '⏳', req: (d) => (d.totalTime || 0) >= 86400 },
            { id: 'tot_48h', cat: 'Celkový čas', title: '48h: Stroj času', icon: '🚀', req: (d) => (d.totalTime || 0) >= 172800 },
            { id: 'tot_72h', cat: 'Celkový čas', title: '72h: Zkamenělina', icon: '🗿', req: (d) => (d.totalTime || 0) >= 259200 },
            { id: 'tot_100h', cat: 'Celkový čas', title: '100h: Magor!', icon: '🤯', req: (d) => (d.totalTime || 0) >= 360000 },
            // Počet tréninků (historie)
            { id: 'cnt_1', cat: 'Počet tréninků', title: '1. cvičení: První krok', icon: '👶', req: (d) => getWorkoutCount(d) >= 1 },
            { id: 'cnt_5', cat: 'Počet tréninků', title: '5x: Rozcvička', icon: '👟', req: (d) => getWorkoutCount(d) >= 5 },
            { id: 'cnt_10', cat: 'Počet tréninků', title: '10x: Zahřátí', icon: '🔥', req: (d) => getWorkoutCount(d) >= 10 },
            { id: 'cnt_30', cat: 'Počet tréninků', title: 'Měsíc v pohybu (30)', icon: '📅', req: (d) => getWorkoutCount(d) >= 30 },
            { id: 'cnt_60', cat: 'Počet tréninků', title: '2 měsíce (60)', icon: '💪', req: (d) => getWorkoutCount(d) >= 60 },
            { id: 'cnt_182', cat: 'Počet tréninků', title: 'Půlrok dřiny (182)', icon: '🏆', req: (d) => getWorkoutCount(d) >= 182 },
            { id: 'cnt_365', cat: 'Počet tréninků', title: 'Rok! Železná disciplína', icon: '👑', req: (d) => getWorkoutCount(d) >= 365 },
            // Streak
            { id: 'str_5', cat: 'Ohnivá série (Streak)', title: '5 dní: Jiskra', icon: '✨', req: (d) => calculateCurrentStreak(d) >= 5 },
            { id: 'str_10', cat: 'Ohnivá série (Streak)', title: '10 dní: Plamen', icon: '🔥', req: (d) => calculateCurrentStreak(d) >= 10 },
            { id: 'str_30', cat: 'Ohnivá série (Streak)', title: 'Měsíc: Požár', icon: '🚒', req: (d) => calculateCurrentStreak(d) >= 30 },
            { id: 'str_60', cat: 'Ohnivá série (Streak)', title: '2 měsíce: Peklo', icon: '🌋', req: (d) => calculateCurrentStreak(d) >= 60 },
            { id: 'str_182', cat: 'Ohnivá série (Streak)', title: 'Půlrok: Nezastavitelný', icon: '🚂', req: (d) => calculateCurrentStreak(d) >= 182 },
            { id: 'str_365', cat: 'Ohnivá série (Streak)', title: 'Rok: Legenda', icon: '🌠', req: (d) => calculateCurrentStreak(d) >= 365 },
            // Časová zvířata (tyto se ukládají ručně při splnění, takže check z databáze)
            { id: 'time_morning', cat: 'Časové odznaky', title: 'Ranní ptáče (6-8h)', icon: '🌅', req: (d) => (d.achievements && d.achievements['time_morning']) },
            { id: 'time_night', cat: 'Časové odznaky', title: 'Noční zvíře (20-00h)', icon: '🦉', req: (d) => (d.achievements && d.achievements['time_night']) },
            { id: 'time_insomnia', cat: 'Časové odznaky', title: 'Nespavec (00-6h)', icon: '🦇', req: (d) => (d.achievements && d.achievements['time_insomnia']) }
        ];

        // Zvuky
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'beep') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'gong') {
                osc.type = 'square'; osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 1.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                osc.start(); osc.stop(audioCtx.currentTime + 1.5);
            }
        }

        // Pomocné formátování a logika
        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0');
            const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        function formatTimeLong(sec) {
            const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60;
            if (h > 0) return `${h}h ${m}m`;
            return m === 0 ? `${s}s` : `${m}m ${s}s`;
        }
        function getWorkoutCount(userData) { return userData.history ? Object.keys(userData.history).length : 0; }
        
        function getLevel(sec) {
            const m = sec / 60;
            if (m < 60) return '🪵 Dřevěný střed';
            if (m < 300) return '🪨 Kámen';
            if (m < 1200) return '⚙️ Železné břicho';
            return '💎 Titanový Terminátor';
        }

        function calculateCurrentStreak(userData) {
            let streak = userData.streak || 0;
            if (!userData.lastDate || streak === 0) return 0;
            let today = new Date(); today.setHours(0,0,0,0);
            let lastDate = new Date(userData.lastDate); lastDate.setHours(0,0,0,0);
            let diffDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24));
            let restDays = userData.restDays || [false,false,false,false,false,false,false];
            if (diffDays <= 1) return streak;
            for (let i = 1; i < diffDays; i++) {
                let checkDate = new Date(lastDate); checkDate.setDate(checkDate.getDate() + i);
                if (!restDays[(checkDate.getDay() + 6) % 7]) return 0;
            }
            return streak;
        }

        // VYKRESLENÍ ACHIEVEMENTŮ
        function renderAchievements(containerId, userData) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            // Seskupit podle kategorie
            const categories = {};
            ACHIEVEMENTS.forEach(a => {
                if(!categories[a.cat]) categories[a.cat] = [];
                categories[a.cat].push(a);
            });

            for (const [catName, achList] of Object.entries(categories)) {
                let catHtml = `<div class="ach-category-title">${catName}</div><div class="achievements-grid">`;
                achList.forEach(a => {
                    const isUnlocked = a.req(userData);
                    catHtml += `
                        <div class="ach-box ${isUnlocked ? 'unlocked' : ''}" title="${a.title}">
                            <div>${a.icon}</div>
                            <div class="ach-title">${a.title}</div>
                        </div>`;
                });
                catHtml += `</div>`;
                container.innerHTML += catHtml;
            }
        }

        // DB Listener (hlavní načítání)
        db.ref('users').on('value', (snapshot) => {
            allUsersData = snapshot.val() || {};
            const userSelect = document.getElementById('user-select');
            const selectedVal = userSelect.value;
            userSelect.innerHTML = '<option value="">-- Kdo jde cvičit? --</option>';
            
            let usersArray = Object.keys(allUsersData).map(key => ({ id: key, ...allUsersData[key], displayStreak: calculateCurrentStreak(allUsersData[key]) }));
            usersArray.sort((a, b) => (b.totalTime || 0) - (a.totalTime || 0));

            let statsHtml = '';
            usersArray.forEach((user, index) => {
                const opt = document.createElement('option');
                opt.value = user.id; opt.textContent = user.name;
                userSelect.appendChild(opt);

                // OPRAVA ZAROVNÁNÍ KORUNKY
                let rankVisual = index === 0 ? '<div class="rank-box crown">👑</div>' : `<div class="rank-box">${index + 1}.</div>`;
                let streakVisual = user.displayStreak > 0 ? `<span style="background:#ff9800; color:#000; padding:2px 6px; border-radius:10px; font-size:12px; font-weight:bold;">🔥 ${user.displayStreak}</span>` : '';

                statsHtml += `
                    <div class="stat-item">
                        <div style="display:flex; align-items: center; width: 100%;">
                            ${rankVisual}
                            <span style="font-size:24px; margin-right:10px;">${user.avatar || '👤'}</span>
                            <div style="flex-grow: 1;">
                                <div style="font-weight:bold; font-size:1.1em; margin-bottom:3px;">${user.name} ${streakVisual}</div>
                                <div style="font-size: 0.85em; color: #aaa;">Celkem: <strong style="color:white;">${formatTimeLong(user.totalTime || 0)}</strong> | Max: <strong style="color:#ffeb3b;">${formatTimeLong(user.longestPlank || 0)}</strong></div>
                            </div>
                            <button class="view-profile-btn" onclick="openPublicProfile('${user.id}')">👁️ Profil</button>
                        </div>
                    </div>`;
            });
            
            document.getElementById('stats-list').innerHTML = usersArray.length === 0 ? 'Zatím žádná data.' : statsHtml;
            if(selectedVal && allUsersData[selectedVal]) userSelect.value = selectedVal;
            if (currentUser && allUsersData[currentUser]) updateProfileUI();
        });

        // PŘEPÍNÁNÍ OBRAZOVEK A PROFIL
        document.getElementById('user-select').addEventListener('change', (e) => {
            if(e.target.value) {
                currentUser = e.target.value;
                hideAll(); document.getElementById('profile-section').style.display = 'block';
                updateProfileUI();
            }
        });

        function hideAll() {
            ['setup-section', 'profile-section', 'workout-section', 'public-profile-section'].forEach(id => document.getElementById(id).style.display = 'none');
        }

        function logout() {
            currentUser = null;
            hideAll(); document.getElementById('setup-section').style.display = 'block';
            document.getElementById('user-select').value = "";
        }

        function openPublicProfile(userId) {
            const data = allUsersData[userId];
            if(!data) return;
            hideAll(); document.getElementById('public-profile-section').style.display = 'block';
            
            document.getElementById('pub-profile-name').textContent = data.name;
            document.getElementById('pub-avatar-display').textContent = data.avatar || '👤';
            let streak = calculateCurrentStreak(data);
            document.getElementById('pub-streak-display').textContent = streak > 0 ? `🔥 Série: ${streak} dní` : '';
            document.getElementById('pub-level-display').textContent = getLevel(data.totalTime || 0);
            document.getElementById('pub-total-time').textContent = formatTimeLong(data.totalTime || 0);
            document.getElementById('pub-max-time').textContent = formatTimeLong(data.longestPlank || 0);
            document.getElementById('pub-workout-count').textContent = getWorkoutCount(data);
            
            renderAchievements('pub-achievements-container', data);
        }

        function closePublicProfile() {
            hideAll(); document.getElementById('setup-section').style.display = 'block';
        }

        function goToWorkout() {
            hideAll(); document.getElementById('workout-section').style.display = 'block';
            document.getElementById('workout-user-name').textContent = `Jdeme na to, ${allUsersData[currentUser].name}!`;
        }

        function cancelWorkout() {
            clearInterval(timerInterval); clearInterval(countdownInterval);
            isPlanking = false; secondsElapsed = 0;
            document.getElementById('timer-display').textContent = "00:00";
            document.getElementById('countdown-display').textContent = "";
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('start-btn').style.display = 'inline-block';
            hideAll(); document.getElementById('profile-section').style.display = 'block';
        }

        // AKTUALIZACE VLASTNÍHO PROFILU
        function updateProfileUI() {
            const data = allUsersData[currentUser];
            if(!data) return;
            
            let streak = calculateCurrentStreak(data);
            document.getElementById('profile-name').textContent = data.name;
            document.getElementById('avatar-display').textContent = data.avatar || '👤';
            document.getElementById('streak-display').textContent = streak > 0 ? `🔥 Série: ${streak} dní` : '';
            document.getElementById('level-display').textContent = getLevel(data.totalTime || 0);

            let restDays = data.restDays || [false,false,false,false,false,false,false];
            document.querySelectorAll('.day-box').forEach(box => {
                let d = parseInt(box.getAttribute('data-day'));
                box.classList.toggle('rest', restDays[d]);
            });

            // Vykreslit moji vitrínu
            renderAchievements('my-achievements-container', data);

            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            if (data.history) {
                let logs = Object.keys(data.history).map(k => ({ id: k, ...data.history[k] })).reverse();
                logs.forEach(log => {
                    let d = new Date(log.timestamp).toLocaleString('cs-CZ', {day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
                    historyList.innerHTML += `
                        <div class="history-item">
                            <span>🕒 ${d} - <strong>${formatTimeLong(log.duration)}</strong></span>
                            <button class="del-btn" onclick="deleteWorkoutLog('${log.id}')">Smazat</button>
                        </div>`;
                });
            } else {
                historyList.innerHTML = '<div style="color:#666;">Zatím žádné tréninky.</div>';
            }
        }

        function changeAvatar() {
            let current = document.getElementById('avatar-display').textContent;
            let nextIdx = (avatars.indexOf(current) + 1) % avatars.length;
            db.ref(`users/${currentUser}`).update({ avatar: avatars[nextIdx] });
        }

        document.querySelectorAll('.day-box').forEach(box => {
            box.addEventListener('click', () => {
                if (!currentUser) return;
                let d = parseInt(box.getAttribute('data-day'));
                let r = allUsersData[currentUser].restDays || [false,false,false,false,false,false,false];
                r[d] = !r[d];
                db.ref(`users/${currentUser}`).update({ restDays: r });
            });
        });

        function addUser() {
            const name = document.getElementById('new-user-name').value.trim();
            if (!name) return alert("Zadej jméno!");
            db.ref('users').push({ 
                name: name, totalTime: 0, longestPlank: 0, streak: 0, lastDate: null, avatar: '👤',
                restDays: [false,false,false,false,false,false,false],
                achievements: {} 
            }).then(() => document.getElementById('new-user-name').value = '')
              .catch(err => alert("Chyba: " + err.message));
        }

        function deleteProfile() {
            if (confirm("Opravdu smazat profil? Vše zmizí!")) db.ref(`users/${currentUser}`).remove().then(logout);
        }

        function deleteWorkoutLog(logId) {
            if (!confirm("Smazat tento trénink? Čas se odečte ze statistik.")) return;
            db.ref(`users/${currentUser}/history/${logId}`).remove().then(() => {
                db.ref(`users/${currentUser}/history`).once('value', snap => {
                    let hists = snap.val() || {}; let newTotal = 0; let newMax = 0;
                    Object.values(hists).forEach(h => { newTotal += h.duration; if (h.duration > newMax) newMax = h.duration; });
                    db.ref(`users/${currentUser}`).update({ totalTime: newTotal, longestPlank: newMax });
                });
            });
        }

        // CVIČENÍ A ULOŽENÍ
        function startCountdown() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'none';
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            let count = 3;
            document.getElementById('countdown-display').textContent = `Připrav se... ${count}`;
            playSound('beep');
            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    document.getElementById('countdown-display').textContent = `Připrav se... ${count}`;
                    playSound('beep');
                } else {
                    clearInterval(countdownInterval);
                    document.getElementById('countdown-display').textContent = "🔥 JEĎ! 🔥";
                    playSound('gong');
                    setTimeout(() => document.getElementById('countdown-display').textContent = "", 1500);
                    startPlank();
                }
            }, 1000);
        }

        function startPlank() {
            isPlanking = true;
            document.getElementById('stop-btn').style.display = 'inline-block';
            secondsElapsed = 0; document.getElementById('timer-display').textContent = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                document.getElementById('timer-display').textContent = formatTime(secondsElapsed);
            }, 1000);
        }

        function stopTimer() {
            if (!isPlanking) return;
            clearInterval(timerInterval); isPlanking = false;
            playSound('gong');
            
            const data = allUsersData[currentUser];
            const isPersonalRecord = secondsElapsed > (data.longestPlank || 0) && secondsElapsed > 10;
            if (isPersonalRecord) confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            
            const newTotal = (data.totalTime || 0) + secondsElapsed;
            const newLongest = Math.max(data.longestPlank || 0, secondsElapsed);
            
            let updates = { totalTime: newTotal, longestPlank: newLongest };
            
            // Kontrola časových achievementů (ukládají se do DB navždy)
            let achUpdates = data.achievements || {};
            let currentHour = new Date().getHours();
            if (currentHour >= 6 && currentHour < 8) achUpdates['time_morning'] = true;
            if (currentHour >= 20 || currentHour === 23) achUpdates['time_night'] = true;
            if (currentHour >= 0 && currentHour < 6) achUpdates['time_insomnia'] = true;
            updates.achievements = achUpdates;

            // Streak logika
            let todayStr = new Date().toLocaleDateString('en-CA');
            let currentStreak = calculateCurrentStreak(data);
            if (data.lastDate !== todayStr) {
                updates.streak = currentStreak + 1;
                updates.lastDate = todayStr;
            }

            db.ref(`users/${currentUser}/history`).push({ duration: secondsElapsed, timestamp: Date.now() });
            
            db.ref(`users/${currentUser}`).update(updates).then(() => {
                setTimeout(() => {
                    let msg = isPersonalRecord ? "NOVÝ OSOBNÍ REKORD! 🎉\n\n" : "Skvělá práce!\n\n";
                    alert(msg + `Čas: ${formatTimeLong(secondsElapsed)}`);
                    cancelWorkout();
                }, 500);
            });
        }
    </script>
</body>
</html>
