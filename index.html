<!DOCTYPE html>
<html lang="cs">
<head>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #4caf50; margin-top: 0; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #4caf50; color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button.stop { background: #f44336; height: 80px; font-size: 20px; }
        .text-btn { background: transparent; margin-top: 10px; padding: 8px; font-size: 14px; color: #888; }
        
        .timer { font-size: 70px; font-weight: bold; margin: 20px 0; font-variant-numeric: tabular-nums; }
        .countdown { color: #ffeb3b; font-size: 30px; min-height: 40px; margin-top: 10px; }
        
        .stats { text-align: left; margin-top: 20px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; background: #333; padding: 8px 5px; font-size: 12px; border-radius: 5px; margin: 0; white-space: nowrap; }
        .tab-btn.active { background: #4caf50; color: white; }
        
        .stat-item { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #444; display: flex; align-items: flex-start; justify-content: space-between; }
        .stat-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .rank-box { width: 35px; text-align: center; font-size: 1.4em; font-weight: bold; color: #888; margin-right: 10px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; margin-top: 5px;}
        
        .player-info { flex-grow: 1; display: flex; flex-direction: column; text-align: left; }
        .player-name-row { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-today { background: #4caf50; box-shadow: 0 0 5px #4caf50; }
        .status-yesterday { background: #ffeb3b; }
        .status-sleep { background: #f44336; }
        
        .stat-main-val { font-size: 1.2em; font-weight: bold; color: white; }
        .stat-sub-val { font-size: 0.85em; color: #aaa; margin-top: 2px; }
        .diff-text { font-size: 0.75em; color: #ff9800; margin-top: 4px; font-weight: bold; }
        
        .view-profile-btn { background: #333; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 5px; width: auto; margin: 0; margin-top: 5px; height: fit-content;}
        
        .profile-header { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 10px; }
        .avatar-btn { background: #333; font-size: 40px; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0; padding: 0; border: 2px solid #4caf50; flex-shrink: 0; }
        .level-badge { background: #ffeb3b; color: #000; padding: 5px 10px; border-radius: 15px; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        
        .achievements-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin: 15px 0; }
        .ach-box { background: #333; border-radius: 8px; padding: 8px 5px; text-align: center; font-size: 24px; opacity: 0.3; filter: grayscale(100%); transition: 0.3s; position: relative; }
        .ach-box.unlocked { opacity: 1; filter: grayscale(0%); background: #3a4a3a; box-shadow: 0 0 5px rgba(76, 175, 80, 0.3); border: 1px solid #4caf50; cursor: pointer; }
        .ach-box.unlocked:active { transform: scale(0.95); }
        .ach-title { font-size: 9px; color: #fff; margin-top: 5px; line-height: 1.1; word-wrap: break-word; }
        .ach-category-title { font-size: 13px; color: #aaa; text-align: left; margin-top: 15px; margin-bottom: 5px; border-bottom: 1px solid #444; padding-bottom: 3px; }
        .showcase-star { position: absolute; top: -5px; right: -5px; font-size: 14px; text-shadow: 0 0 5px black; }
        
        .days-container { display: flex; justify-content: space-between; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px;}
        .day-box { width: 35px; height: 35px; background: #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; user-select: none; }
        .day-box.rest { background: #2196f3; color: white; box-shadow: 0 0 8px rgba(33, 150, 243, 0.5); }
        
        .history-list { max-height: 150px; overflow-y: auto; background: #222; padding: 10px; border-radius: 8px; text-align: left; margin-bottom: 15px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #444; font-size: 14px; }
        .del-btn { background: transparent; color: #f44336; padding: 2px 5px; margin: 0; width: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="app-title">Plank Tracker ⏱️</h1>

        <!-- 1. HLAVNÍ OBRAZOVKA -->
        <div id="setup-section">

                <input type="password" id="new-user-pin" placeholder="PIN (ochrana)" style="flex: 1;" maxlength="4">
            </div>
            <button onclick="addUser()">Přidat nového člověka</button>
            
            <div class="stats">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin:0; color: #ffeb3b;">🏆 Síň slávy</h3>
                    <div style="font-size: 10px; color: #888;">
                        <span class="status-dot status-today" style="width:8px;height:8px;"></span> Dnes 
                        <span class="status-dot status-yesterday" style="width:8px;height:8px;margin-left:5px;"></span> Včera
                    </div>
                </div>
                
                <div class="tabs">
                    <button class="tab-btn active" onclick="changeLeaderboard('total', this)">Celkově</button>
                    <button class="tab-btn" onclick="changeLeaderboard('month', this)">Tento měsíc</button>
                    <button class="tab-btn" onclick="changeLeaderboard('max', this)">Max Výdrž</button>
                    <button class="tab-btn" onclick="changeLeaderboard('streak', this)">Série 🔥</button>
                </div>
                
                <div id="stats-list">Načítám data...</div>
            </div>
        </div>

        <!-- 2. TVŮJ PROFIL -->
        <div id="profile-section" style="display:none;">
            <div class="profile-header">
                <button class="avatar-btn" id="avatar-display" onclick="changeAvatar()"></button>

                </div>
            </div>
            <div id="level-display" class="level-badge"></div>
            <button onclick="goToWorkout()" style="font-size: 18px; padding: 15px; margin-bottom: 15px;">JÍT CVIČIT 💪</button>

            <!-- Dny odpočinku -->
            <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">💤 Dny odpočinku (Kliknutím zmodrá):</div>
            <div class="days-container" id="rest-days-container">
                <div class="day-box" data-day="0">Po</div>
                <div class="day-box" data-day="1">Út</div>
                <div class="day-box" data-day="2">St</div>
                <div class="day-box" data-day="3">Čt</div>
                <div class="day-box" data-day="4">Pá</div>
                <div class="day-box" data-day="5">So</div>
                <div class="day-box" data-day="6">Ne</div>
            </div>

            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 15px;">🏅 Tvoje Vitrína (Kliknutím vyber 3 k chlubení)</div>
            <div id="my-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto;"></div>
            
            <div style="font-size: 12px; color: #888; text-align: left; margin-top: 15px;">🕒 Historie:</div>
            <div class="history-list" id="history-list"></div>

            <button class="text-btn" onclick="logout()">🔙 Zpět na výběr osoby</button>
            <button class="text-btn" onclick="deleteProfile()" style="color: #f44336; float: right;">🗑️ Smazat profil</button>
        </div>

        <!-- 3. OBRAZOVKA CVIČENÍ -->
        <div id="workout-section" style="display:none;">
            <h2 id="workout-user-name" style="color: #4caf50;"></h2>
            <div id="countdown-display" class="countdown"></div>
            <div class="timer" id="timer-display">00:00</div>
            <button id="start-btn" onclick="startCountdown()" style="height: 60px; font-size: 18px;">START (3s příprava)</button>
            <button id="stop-btn" class="stop" onclick="stopTimer()" style="display:none;">Konec planku</button>
            <button class="text-btn" id="cancel-btn" onclick="cancelWorkout()" style="margin-top: 20px;">Zrušit (Nezapočítávat)</button>
        </div>

        <!-- 4. VEŘEJNÝ PROFIL -->
        <div id="public-profile-section" style="display:none;">
            <div class="profile-header">
                <div class="avatar-btn" id="pub-avatar-display" style="border-color: #888; cursor: default;"></div>
                <div style="text-align: left;">
                    <h2 id="pub-profile-name" style="margin: 0; color: #fff;"></h2>

                </div>
            </div>
            <div id="pub-level-display" class="level-badge" style="background:#555; color:#fff;"></div>
            <div class="stats" style="margin-top: 10px;">
                <div style="display: flex; justify-content: space-around; text-align: center;">
                    <div><div style="font-size:12px; color:#aaa;">Celkem</div><strong id="pub-total-time"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Maximum</div><strong id="pub-max-time" style="color:#ffeb3b;"></strong></div>
                    <div><div style="font-size:12px; color:#aaa;">Tréninků</div><strong id="pub-workout-count"></strong></div>
                </div>
            </div>
            <div style="text-align: left; font-weight: bold; color: #ffeb3b; margin-top: 15px;">🏅 Vitrína hráče</div>
            <div id="pub-achievements-container" style="background: #222; padding: 10px; border-radius: 8px; margin-top: 5px; max-height: 300px; overflow-y: auto;"></div>
            <button onclick="closePublicProfile()" style="margin-top: 20px;">Zavřít profil</button>
        </div>

    </div>

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime;
            
            if (type === 'beep') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, t);
                gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(0.3, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.2);
            } else if (type === 'gong') {
                const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
                osc1.type = 'sine'; osc2.type = 'sine';
                osc1.frequency.setValueAtTime(440, t); osc2.frequency.setValueAtTime(444, t);
                gainNode.gain.setValueAtTime(0, t); gainNode.gain.linearRampToValueAtTime(0.5, t + 0.1); gainNode.gain.exponentialRampToValueAtTime(0.001, t + 2.5);
                osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc1.start(t); osc2.start(t); osc1.stop(t + 3); osc2.stop(t + 3);
            }
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60).toString().padStart(2, '0'); const s = (sec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        function formatTimeLong(sec) {
            const h = Math.floor(sec / 3600); const m = Math.floor((sec % 3600) / 60); const s = sec % 60;
            if (h > 0) return `${h}h ${m}m`;
            return m === 0 ? `${s}s` : `${m}m ${s}s`;
        }
        
        function getLevel(sec) {
            const m = sec / 60;
            if (m < 60) return '🪵 Dřevěný střed';
            if (m < 300) return '🪨 Kámen';
            if (m < 1200) return '⚙️ Železné břicho';
            return '💎 Titanový Terminátor';
        }

        function calculateCurrentStreak(userData) {
            let streak = userData.streak || 0;
            if (!userData.lastDate || streak === 0) return 0;
            let today = new Date(); today.setHours(0,0,0,0);
            let lastDate = new Date(userData.lastDate); lastDate.setHours(0,0,0,0);
            let diffDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24));
            let restDays = userData.restDays || [false,false,false,false,false,false,false];
            if (diffDays <= 1) return streak;
            for (let i = 1; i < diffDays; i++) {
                let checkDate = new Date(lastDate); checkDate.setDate(checkDate.getDate() + i);
                if (!restDays[(checkDate.getDay() + 6) % 7]) return 0;
            }
            return streak;
        }

        function getActivityStatus(userData) {
            if (!userData.lastDate) return 'sleep';
            let today = new Date(); today.setHours(0,0,0,0);
            let lastDate = new Date(userData.lastDate); lastDate.setHours(0,0,0,0);
            let diffDays = Math.round((today - lastDate) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return 'today';
            if (diffDays === 1) return 'yesterday';
            return 'sleep';
        }

        function updateLeaderboard() {
            let usersArray = Object.keys(allUsersData).map(key => {
                let u = allUsersData[key];
                let displayStreak = calculateCurrentStreak(u);
                let thisMonthTime = 0;
                let now = new Date();
                if (u.history) {
                    Object.values(u.history).forEach(log => {
                        let d = new Date(log.timestamp);
                        if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                            thisMonthTime += log.duration;
                        }
                    });
                }
                
                let achCount = ACHIEVEMENTS.filter(a => a.req(u)).length;
                
                return { id: key, ...u, displayStreak, thisMonthTime, actStatus: getActivityStatus(u), achCount };
            });

            let globalMaxPlank = Math.max(...usersArray.map(u => u.longestPlank || 0));
            let globalMaxStreak = Math.max(...usersArray.map(u => u.displayStreak || 0));
            let totalPossibleAch = ACHIEVEMENTS.length;

            usersArray.sort((a, b) => {
                if (currentSort === 'total') return (b.totalTime || 0) - (a.totalTime || 0);
                if (currentSort === 'month') return (b.thisMonthTime || 0) - (a.thisMonthTime || 0);
                if (currentSort === 'max') return (b.longestPlank || 0) - (a.longestPlank || 0);
                if (currentSort === 'streak') return (b.displayStreak || 0) - (a.displayStreak || 0);
            });

            let statsHtml = '';
            usersArray.forEach((user, index) => {
                let mainStatLabel = ''; let mainStatValue = ''; let subStatText = ''; let diffValue = 0;
                
                if (currentSort === 'total') {
                    mainStatLabel = 'Celkem:'; mainStatValue = formatTimeLong(user.totalTime || 0);
                    subStatText = `Max: ${formatTimeLong(user.longestPlank || 0)} | Úspěchy: ${user.achCount}/${totalPossibleAch}`;
                    diffValue = index > 0 ? (usersArray[index-1].totalTime || 0) - (user.totalTime || 0) : 0;
                } else if (currentSort === 'month') {
                    mainStatLabel = 'Tento měsíc:'; mainStatValue = formatTimeLong(user.thisMonthTime);
                    subStatText = `Celkově: ${formatTimeLong(user.totalTime || 0)} | Úspěchy: ${user.achCount}`;
                    diffValue = index > 0 ? usersArray[index-1].thisMonthTime - user.thisMonthTime : 0;
                } else if (currentSort === 'max') {
                    mainStatLabel = 'Max výdrž:'; mainStatValue = formatTimeLong(user.longestPlank || 0);
                    subStatText = `Série: ${user.displayStreak} | Úspěchy: ${user.achCount}/${totalPossibleAch}`;
                    diffValue = index > 0 ? (usersArray[index-1].longestPlank || 0) - (user.longestPlank || 0) : 0;
                } else if (currentSort === 'streak') {
                    mainStatLabel = 'Série:'; mainStatValue = `${user.displayStreak} dní`;
                    subStatText = `Celkem: ${formatTimeLong(user.totalTime || 0)} | Úspěchy: ${user.achCount}`;
                    diffValue = index > 0 ? usersArray[index-1].displayStreak - user.displayStreak : 0;
                }

                let showcaseHtml = (user.showcase || []).map(id => {
                    let a = ACHIEVEMENTS.find(x => x.id === id);
                    return a ? `<span title="${a.title}" style="font-size: 14px; background:#444; padding:2px; border-radius:5px; margin-left:3px;">${a.icon}</span>` : '';
                }).join('');

                let badges = [];
                if (currentSort !== 'streak' && user.displayStreak > 0) badges.push(`<span style="background:#ff9800; color:#000; padding:2px 5px; border-radius:8px; font-size:10px;">🔥 ${user.displayStreak}</span>`);
                if (user.longestPlank > 0 && user.longestPlank === globalMaxPlank) badges.push(`<span title="Nejdelší výdrž ze všech">💪</span>`);
                if (user.displayStreak > 0 && user.displayStreak === globalMaxStreak) badges.push(`<span title="Největší série ze všech">🌟</span>`); 
                
                let rankVisual = '';
                if (index === 0) rankVisual = '<div class="rank-box" style="font-size: 1.6em;">🥇</div>';
                else if (index === 1) rankVisual = '<div class="rank-box" style="font-size: 1.6em;">🥈</div>';
                else if (index === 2) rankVisual = '<div class="rank-box" style="font-size: 1.6em;">🥉</div>';
                else rankVisual = `<div class="rank-box">${index + 1}.</div>`;
                
                let diffTextHtml = '';
                if (index > 0 && diffValue > 0) {
                    let diffFormat = currentSort === 'streak' ? `${diffValue} dní` : formatTimeLong(diffValue);
                    diffTextHtml = `<div class="diff-text">Chybí ${diffFormat} na ${usersArray[index-1].name} ⬆️</div>`;
                }

                statsHtml += `
                    <div class="stat-item">
                        ${rankVisual}
                        <div style="font-size:35px; margin-right:15px;">${user.avatar || '👤'}</div>
                        <div class="player-info">
                            <div class="player-name-row">
                                <span class="status-dot status-${user.actStatus}"></span>
                                ${user.name} 
                                ${badges.join(' ')}
                                ${showcaseHtml}
                            </div>
                            <div class="stat-main-val">${mainStatLabel} ${mainStatValue}</div>
                            <div class="stat-sub-val">${subStatText}</div>
                            ${diffTextHtml}
                        </div>
                        <button class="view-profile-btn" onclick="openPublicProfile('${user.id}')">👁️ Profil</button>
                    </div>`;
            });
            
            document.getElementById('stats-list').innerHTML = usersArray.length === 0 ? '<div style="color:#aaa;">Zatím žádná data. Přidej se!</div>' : statsHtml;
        }

        }

        function stopTimer() {
            if (!isPlanking) return;
            clearInterval(timerInterval); isPlanking = false;
            playSound('gong');
            
            const data = allUsersData[currentUser];
            let currentStreak = calculateCurrentStreak(data);
            const isPersonalRecord = secondsElapsed > (data.longestPlank || 0) && secondsElapsed > 10;
            
            if (isPersonalRecord) confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            
            const newTotal = (data.totalTime || 0) + secondsElapsed;
            const newLongest = Math.max(data.longestPlank || 0, secondsElapsed);
            
            let updates = { totalTime: newTotal, longestPlank: newLongest };
            
            let achUpdates = data.achievements || {};
            let d = new Date();
            let month = d.getMonth(); 
            let date = d.getDate();
            let day = d.getDay(); 
            let hour = d.getHours();

            if (isPersonalRecord && currentStreak >= 30) achUpdates['ach_second_wind'] = true;
            
            if (day === 0 || day === 6) {
                let historyArr = Object.values(data.history || {});
                historyArr.push({timestamp: Date.now()}); 
                let recent = historyArr.filter(log => (Date.now() - log.timestamp) < 3 * 24 * 3600 * 1000);
                let hasSat = recent.some(l => new Date(l.timestamp).getDay() === 6);
                let hasSun = recent.some(l => new Date(l.timestamp).getDay() === 0);
                if (hasSat && hasSun) achUpdates['ach_weekend'] = true;
            }

            if (hour >= 6 && hour < 8) achUpdates['time_morning'] = true;
            if (hour >= 20 || hour === 23) achUpdates['time_night'] = true;
            if (month === 11 && date === 24) achUpdates['ach_xmas'] = true; 
            if (month === 11 && date === 31) achUpdates['ach_nye'] = true; 
            if (month === 0 && date === 1) achUpdates['ach_ny'] = true; 
            if (month === 9 && date === 31) achUpdates['ach_hallo'] = true; 
            if (month === 1 && date === 14) achUpdates['ach_val'] = true; 
            if (month === 1 && date === 29) achUpdates['ach_leap'] = true; 
            if (day === 5 && date === 13) achUpdates['ach_fri13'] = true; 
            
            if (secondsElapsed === 201) achUpdates['ach_321'] = true; 
            if (secondsElapsed === 244) achUpdates['ach_404'] = true; 
            if (secondsElapsed === 194) achUpdates['ach_pi'] = true;  

            updates.achievements = achUpdates;

            let todayStr = new Date().toLocaleDateString('en-CA');
            if (data.lastDate !== todayStr) {
                updates.streak = currentStreak + 1;
                updates.lastDate = todayStr;
            }

            db.ref(`users/${currentUser}/history`).push({ duration: secondsElapsed, timestamp: Date.now() });
            
            db.ref(`users/${currentUser}`).update(updates).then(() => {
                setTimeout(() => {
                    let msg = isPersonalRecord ? "NOVÝ OSOBNÍ REKORD! 🎉\n\n" : "Skvělá práce!\n\n";
                    alert(msg + `Čas: ${formatTimeLong(secondsElapsed)}`);
                    cancelWorkout();
                }, 500);
            });
        }
    </script>
